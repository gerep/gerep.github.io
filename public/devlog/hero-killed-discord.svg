<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a96e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b7d6f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="#262626"/>
  
  <!-- Central point concept -->
  <circle cx="300" cy="150" r="8" fill="#c9a96e"/>
  
  <!-- Converging lines from corners -->
  <line x1="0" y1="0" x2="300" y2="150" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="0" x2="300" y2="150" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="300" x2="300" y2="150" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="300" x2="300" y2="150" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Horizontal and vertical focus lines -->
  <line x1="50" y1="150" x2="250" y2="150" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>
  <line x1="350" y1="150" x2="550" y2="150" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="30" x2="300" y2="130" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="170" x2="300" y2="270" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Geometric frame -->
  <rect x="150" y="75" width="300" height="150" fill="none" stroke="#8b7d6f" stroke-width="1.5" opacity="0.3"/>
  <rect x="170" y="95" width="260" height="110" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.5"/>
</svg>
